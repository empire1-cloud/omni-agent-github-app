[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agent"
version = "0.2.0"
description = "Turns backlog tasks into verified code changes with guardrails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
omni-agent = "omni_agent.cli:main"

[tool.setuptools.packages.find]
include = ["omni_agent*"]
exclude = ["omni_agent.tests*", "omni_agent.state*", "omni_agent.reports*", "omni_agent.sales*"]

[tool.setuptools.package-data]
omni_agent = ["config.yaml", "demo/repo/**/*.md", "demo/repo/**/*.py"]
